<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">SICA — Sistema Integrado de Control de Acceso</title>
  <desc id="desc">Portada verde de Zona Acme con el símbolo de SICA y las tecnologías Java 17, JavaFX 21, MySQL 8.4 y Maven.</desc>
  <defs>
